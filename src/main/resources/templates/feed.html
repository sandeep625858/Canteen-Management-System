<head>

<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!-- Bootstrap CSS -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
	integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
	integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEysh0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<title>NRIFT - FeedBack</title>
    <link rel="stylesheet" th:href="@{/css/template.css}">
    <link rel="stylesheet" th:href="@{/css/feedback.css}">
</head>

<body class="mainbody">
	<!---------------------------------------------TOP NAVBAR-------------------------------------------------->
	<div>
		<nav class="topnav navbar navbar-expand-sm">
			<!-- Image and text -->
			<nav class="navbar navbar-light bg-light">
				<a class="navbar-brand" href="/user/"> <img
					th:src="@{/images/logo.png}" width="90" height="30"
					class="d-inline-block align-top" alt="" loading="lazy"> NRI
					Fintech
				</a>
			</nav>

			<ul class="navbar-nav ml-auto">

				<li class="nav-item"><a href="#"><i id="icon"
						onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
				</li>
				<li class="nav-item"><a class="nav-link" href="/logout"> Logout </a>
				</li>
			</ul>
		</nav>
	</div>
	<!------------------------------------------------MAIN-------------------------------------------------->
	<div class="container">
		<div class="row col-md-8 offset-md-2">
			<div class="card feedbackcard">

				<div class="feedheader card-header text-white">
					<h2 class="text-center">FEEDBACK FORM</h2>
				</div>

				<div class="card-body ">
					<form action="/user/submitfeedbackform/" method="POST">

						<!--  <div class="form-group mb-3">
                            <label class="form-label">Feedback Id</label>
                            <input class="form-control" id="feedbackId" name="feedbackId" placeholder="Enter Feedback Id"
                                type="text" />
                        </div> -->


						<div class="form-group mb-3">
							<label class="form-label">Name</label> <input
								class="form-control" id="username" name="username"
								placeholder="Enter Name" type="text" th:value="${user.name}" readonly required/>

						</div>

						<div class="form-group mb-3">
							<label class="form-label">Email</label> <input
								class="form-control" id="email" name="email"
								placeholder="Enter Email" type="email" th:value="${user.userEmail}" readonly required/>

						</div>

						<div class="form-group mb-3">
							<label class="form-label">Food Quality</label>
							<div
								class="rating-input-wrapper d-flex justify-content-between mt-2">
								<label><input type="radio" name="rating" value="1" required/><span
									class="feedrate border rounded px-2 py-1">1</span></label> <label><input
									type="radio" name="rating" value="2" required/><span
									class="border rounded px-2 py-1">2</span></label> <label><input
									type="radio" name="rating" value="3" required/><span
									class="border rounded px-2 py-1">3</span></label> <label><input
									type="radio" name="rating" value="4" required/><span
									class="border rounded px-2 py-1">4</span></label> <label><input
									type="radio" name="rating" value="5" required/><span
									class="border rounded px-2 py-1">5</span></label>

							</div>

						</div>

						<div class="form-group mb-3">
							<label class="form-label">Date</label> <input
								class="form-control" id="feedDate" name="feedDate" type="date" required/>
						</div>

						<div class="form-group mb-3">
							<!-- <label class="form-label">Additional Comments</label>
                            <input class="feedcomment form-control" id="feedbackDesc" name="feedbackDesc" placeholder=""
                                type="textbox" /> -->
							<label class="form-label">Additional Comments</label>
							<textarea class="feedcomment form-control" id="feedbackDesc"
								name="feedbackDesc" placeholder="Please share overall experience" cols="40" rows="5"></textarea>
						</div>

						<div class="form-group mb-3">
							<button type="submit" class="feedsubmit btn btn-block">Submit</button>
						</div>
					</form>

				</div>
			</div>
		</div>
	</div>


	<!-- --------------------------------------------FOOTER-------------------------------------------------------->
	<div class="footer">
		<p>Copyright &copy; 2023 NRI Fintech. All rights reserved.</p>
	</div>



	<!--------------------------------- Optional JavaScript; choose one of the two! ----------------->

		crossorigin="anonymous"></script>

		src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
		crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    -->
	<script src="../js/topnav.js"></script>
</body>

</html>
