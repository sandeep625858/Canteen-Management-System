<link rel="stylesheet" th:href="@{/css/template.css}">
<link rel="stylesheet" th:href="@{/css/menu.css}">
</head>

<body class="mainbody">
	<!---------------------------------------------TOP NAVBAR-------------------------------------------------->
	<div>
		<nav class="topnav navbar navbar-expand-sm">
			<!-- Image and text -->
			<nav class="navbar navbar-light bg-light">
				<a class="navbar-brand" href="/admin/"> <img
					th:src="@{/images/logo.png}" width="90" height="30"
					class="d-inline-block align-top" alt="" loading="lazy"> NRI
					Fintech
				</a>
			</nav>

			<ul class="navbar-nav ml-auto">

				<li class="nav-item"><a href="#"><i id="icon"
						onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
				</li>
				<li class="nav-item"><a class="nav-link" href="/logout">
						Logout </a></li>
			</ul>
		</nav>
	</div>
	<!------------------------------------------------MAIN-------------------------------------------------->
	<div>
		<body>
			<h3 class="menuheader text-center">Update Food Item Details</h3>

			<table class="menutable">
				<tr class="menutablehead">
					<th class="heading">Food ID</th>
					<th class="heading">Food Name</th>
					<th class="heading">Food Type</th>
					<th class="heading">Meal</th>
					<th class="heading">Availability</th>
					<th class="heading">Food Price</th>
					<th class="heading">Month</th>
					<!--<th class="heading">Update</th>
					<th class="heading">Delete</th>-->
				</tr>
				<tr class="menutablebody">
					<td class="heading" th:text="${food.foodId}"></td>
					<td class="heading" th:text="${food.foodName}"></td>
					<td class="heading" th:text="${food.category}"></td>
					<td class="heading" th:text="${food.meal}"></td>
					<td class="heading" th:text="${food.foodStatus}"></td>
					<td class="heading" th:text="${food.foodPrice}"></td>
					<td class="heading" th:text="${food.Month}"></td>
				</tr>
			</table>
			<br>
			<br>

			<div class="container">
				<div class="row col-md-8 offset-md-3">
					<div class="card menucard">
						<div class="card-body ">
							<form action="/admin/updateItem/" th:object="${food}"
								method="POST">

								<input type="hidden" id="FoodId" name="FoodId"
									th:value="${food.foodId}"> <br>
								<br>
								
								 <label for="foodName">Food Name : </label> 
								
								<input
									type="text" id="foodName" name="foodName"
									th:value="${food.foodName}" required> <br>
								<br> 	
								
								<label for="category">Food Category : </label>&nbsp;
								
								<input type="radio" id="Veg" name="category"
									value="Veg" required> 
									
								<label for="Veg">Veg</label> 
								
								<input
									type="radio" id="Non-Veg" name="category" value="Nonveg" required>
								
								<label for="Nonveg">Non-Veg</label> 
								
								<br>
								<br> 
								
								<label for="meal">Meal : </label> 
								
								<input type="radio" id="Breakfast" name="meal"
									value="Breakfast" required> 
									
								<label for="Breakfast">Breakfast</label>
								<input type="radio" id="Lunch" name="meal" value="Lunch" required>
								
								<label for="Lunch">Lunch</label> 
								
								<br>
								<br>

								<label for="foodStatus">Food Status : </label>&nbsp;
								
								
								<input type="radio" id="Available" name="foodStatus"
									value="Available" required> 
									
								<label for="Available">Available</label>
								
								
								<input type="radio" id="Unavailable" name="foodStatus"
									value="Unavailable"> <label for="Unavailable" required>Unavailable</label>
								<br>
								<br> 
								
								<label for="foodPrice">Food Price : </label>
								
								 <input
									type="number" id="foodPrice" name="foodPrice"
									th:value="${food.foodPrice}" required>
									
									 <br>
								<br> 
								
								<label for="Month">Month :</label> 		
								
								<select id="Month" name="Month">
			<option value="January">January</option>
			<option value="February">February</option>
			<option value="March">March</option>
			<option value="April">April</option>
			<option value="May">May</option>
			<option value="June">June</option>
			<option value="July">July</option>
			<option value="August">August</option>
			<option value="September">September</option>
			<option value="October">October</option>
			<option value="November">November</option>
			<option value="December">December</option>
		</select>
		<br><br> 
		<label for="Year">Year :</label> 
		<select id="Year" name="Year">
			<option value="2023">2023</option>
			<option value="2024">2024</option>
			<option value="2025">2025</option>
			<option value="2026">2026</option>
			<option value="2027">2027</option>
			<option value="2028">2028</option>
			<option value="2029">2029</option>
			<option value="2030">2030</option>
		</select>
								<br>
								<br>
								<div class="additem">
									<input class="additembutton" type="submit" value="Update Item">
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</body>
	</div>
