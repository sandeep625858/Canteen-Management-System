<title>NRIFT - Orders</title>
<link rel="stylesheet" href="/css/template.css">
<link rel="stylesheet" href="/css/orderCss.css">
</head>

<body>
	<!---------------------------------------------TOP NAVBAR-------------------------------------------------->
	<div>
		<nav class="topnav navbar navbar-expand-sm">
			<!-- Image and text -->
			<nav class="navbar navbar-light bg-light">
				<a class="navbar-brand" href="/user/
                "> <img
					src="/images/logo.png" width="90" height="30"
					class="d-inline-block align-top" alt="" loading="lazy"> NRI
					Fintech
				</a>
			</nav>

			<ul class="navbar-nav ml-auto">

				<li class="nav-item"><a href="#"><i id="icon"
						onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
				</li>
				<li class="nav-item"><a class="nav-link" href="/logout">
						Logout </a></li>
			</ul>
		</nav>
	</div>
	<!------------------------------------------------MAIN-------------------------------------------------->
	<div class="mainbody">

<h3>All Your Orders At One Place</h3>

		

		<form class="form" action="/user/cancelorder" method="get">
			<table id="table">


				<tr class="secheader">
					<td><label>Food Category: </label> <select name="category"
						id="category">
							<option value="default">All</option>
							<option value="Nonveg">Non-Veg</option>
							<option value="Veg">Veg</option>
					</select></td>
					<td><label>Meal: </label> <select name="meal" id="meal">
							<option value="default">All</option>
							<option value="Breakfast">Breakfast</option>
							<option value="Lunch">Lunch</option>
					</select></td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
					<td><input type="text" placeholder="Search.." id="searchBar"
						onkeyup="filterFunc2()"></td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
				</tr>



				<tr>
					<th>Order Id</th>
					<th>Food Name</th>
					<th>Category</th>
					<th>Meal</th>
					<th>Quantity</th>
					<th>Price</th>
					<th>Total Amount</th>
					<th>Payment Status</th>
					<th>Order Status</th>
					<th>Time</th>
					<th>Action</th>

				</tr>

				<tr th:each="temp,iterStat: ${orders}">
					<td th:text="${temp.orderId}"></td>
					<td th:text="${foods[iterStat.index].foodName}"></td>
					<td th:text="${foods[iterStat.index].category}"></td>
					<td th:text="${foods[iterStat.index].meal}"></td>
					<td th:text="${temp.quantity}"></td>
					<td th:text="${temp.orderPrice}"></td>
					<td th:text="${temp.totalAmount}"></td>
					<td th:text="${temp.paymentStatus}"></td>
					<td><span class="orderStatus" th:text="${temp.orderStatus}"></td>
					<td th:text="${temp.savetime}"></td>
					<td><a th:href="@{/user/cancelorder(orderId=${temp.orderId})}"
						class="cancelbutton btn btn-danger ml-2">Cancel</a></td>
				</tr>
			</table>
		</form>
	</div>


	<!-- --------------------------------------------FOOTER-------------------------------------------------------->
	<div class="footer">
		<p>Copyright &copy; 2023 NRI Fintech. All rights reserved.</p>
	</div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    -->
	<script src="../js/topnav.js"></script>
	<script src="../js/userorder.js"></script>
	<script src="../js/search.js"></script>
</body>

</html>
