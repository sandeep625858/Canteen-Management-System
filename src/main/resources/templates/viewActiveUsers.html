<!DOCTYPE html>
<html>
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="../css/template.css">
     <link rel="stylesheet" href="../css/tableStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
        integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEysh0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>NRIFT - Active Users</title>
    

</head>
<body>
	 <!---------------------------------------------TOP NAVBAR-------------------------------------------------->
    <div>
        <nav class="topnav navbar navbar-expand-sm">
            <!-- Image and text -->
            <nav class="navbar navbar-light bg-light">
                <a class="navbar-brand" href="/admin/">
                    <img src="../images/logo.png" width="90" height="30" class="d-inline-block align-top" alt=""
                        loading="lazy">
                    NRI Fintech
                </a>
            </nav>

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a href="#"><i id="icon" onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <!------------------------------------------------MAIN-------------------------------------------------->
    
    
    <div class="mainbody">
    <div  class="container">
    <br/>
		<h1>USER DETAILS</h1>
		<br/>
		<br/>
	
		<div align="center">
		<table id="userTable" border="1" class="table table-bordered table-condensed table-striped">
			<thead>
				<tr>
					<th>User Id</th>
					<th>Name</th>
					<th>Email</th>
					<th>Preference</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user:${userList}">
					<td th:text="${user.userId}"></td>
					<td th:text="${user.name}"></td>
					<td th:text="${user.userEmail}"></td>
					<td th:text="${user.preference}"></td>
					<td><a th:href="@{/admin/userDetails/{Id}(Id=${user.userId})}"><i class='far fa-edit'></i></a>				
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	</div>
	</div>
	
	<!-- --------------------------------------------FOOTER-------------------------------------------------------->
    <div class="footer">
        <p>Copyright &copy; 2023 NRI Fintech. All rights reserved.</p>
    </div>



    <!--------------------------------- Optional JavaScript; choose one of the two! ----------------->

    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
        crossorigin="anonymous"></script>

    <script src="../js/topnav.js"></script>
</body>
</html>
