<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Bootstrap CSS -->

        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
        integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEysh0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>NRIFT - Add Food</title>
    <link rel="stylesheet" th:href="@{/css/template.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
</head>

<body class="mainbody">
    <!---------------------------------------------TOP NAVBAR-------------------------------------------------->
    <div>
        <nav class="topnav navbar navbar-expand-sm">
            <!-- Image and text -->
            <nav class="navbar navbar-light bg-light">
                <a class="navbar-brand" href="/admin/">
                    <img th:src="@{/images/logo.png}" width="90" height="30" class="d-inline-block align-top" alt=""
                        loading="lazy">
                    NRI Fintech
                </a>
            </nav>

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a href="#"><i id="icon" onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <!------------------------------------------------MAIN-------------------------------------------------->
    <div class="container">
		<div class="row col-md-8 offset-md-3">
			<div class="card feedbackcard">

				<div class="feedheader card-header text-white">
					<h2 class="text-center">ADD FOOD ITEM</h2>
				</div>

				<div class="card-body ">
					<form action="/admin/addItem/" method="POST">
		<!--  
		<label for="FoodId">Food ID : </label>
		<input type="text" id="FoodId" name="FoodId">
		<br>
		-->
		<label for="foodName">Food Name : </label> 
		<input type="text" id="foodName" name="foodName" required> 
		<br><br>
		<label for="category">Food Category : </label> 
		<input type="radio" id="Veg" name="category" value="Veg" required> 
		<label for="Veg">Veg</label> 
		<input type="radio" id="Non-Veg" name="category" value="Nonveg" required> 
		<label for="Nonveg">Non-Veg</label>
		<br><br>
		<label for="meal">Meal : </label> 
		<input type="radio" id="Breakfast" name="meal" value="Breakfast" required> 
		<label for="Breakfast">Breakfast</label> 
		<input type="radio" id="Lunch" name="meal" value="Lunch" required> 
		<label for="Lunch">Lunch</label>
		<br><br>
		<label for="foodStatus">Food Status : </label>
		<input type="radio" id="Available" name="foodStatus" value="Available" required> 
		<label for="Available">Available</label> 
		<input type="radio" id="Unavailable" name="foodStatus" value="Unavailable" required> 
		<label for="Unavailable">Unavailable</label>
		<br><br>
		
		<label for="foodPrice">Food Price : </label>
		<input type="number" id="foodPrice" name="foodPrice" required>
		<br><br>
		
		<label for="Month">Month :</label> 
		<select id="Month" name="Month">
			<option value="January">January</option>
			<option value="February">February</option>
			<option value="March">March</option>
			<option value="April">April</option>
			<option value="May">May</option>
			<option value="June">June</option>
			<option value="July">July</option>
			<option value="August">August</option>
			<option value="September">September</option>
			<option value="October">October</option>
			<option value="November">November</option>
			<option value="December">December</option>
		</select>
		<br><br> 
		<label for="Year">Year :</label> 
		<select id="Year" name="Year">
			<option value="2023">2023</option>
			<option value="2024">2024</option>
			<option value="2025">2025</option>
			<option value="2026">2026</option>
			<option value="2027">2027</option>
			<option value="2028">2028</option>
			<option value="2029">2029</option>
			<option value="2030">2030</option>
		</select>
		<br><br>
		<div class="additem"><input class="additembutton" type="submit" value="Add Item"></div>
	</form>

				</div>
			</div>
		</div>
	</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    -->
    <script src="../js/topnav.js"></script>
</body>

</html>
