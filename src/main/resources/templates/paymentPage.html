    <title>Payment</title>
    <link rel="stylesheet" href="/css/template.css">
<link rel="stylesheet" href="/css/orderCss.css">
</head>

<body>
    <!---------------------------------------------TOP NAVBAR-------------------------------------------------->
    <div>
        <nav class="topnav navbar navbar-expand-sm">
            <!-- Image and text -->
            <nav class="navbar navbar-light bg-light">
                <a class="navbar-brand" href="/user/">
                
                    <img src="/images/logo.png" width="90" height="30" class="d-inline-block align-top" alt=""
                        loading="lazy">
                    NRI Fintech
                </a>
            </nav>

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a href="#"><i id="icon" onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <!------------------------------------------------MAIN-------------------------------------------------->
    
    <div class="mainbody">
    <h3>Payment Details</h3>
		<div class="filter">
<table>

	<tr>
		<th>orderId</th>
		<th>Date</th>
		<th>FoodName</th>
		<th>Category</th>
		<th>Meal</th>
		<th>Price</th>
		<th>Quantity</th>
		<th>Total Price</th>
		<th>pay</th>
	</tr>

	<tr th:each="temp,iterStat: ${payment}">
					<td th:text="${temp.orderId}"></td>
					<td th:text="${temp.savetime}"></td>
					<td th:text="${foodList[iterStat.index].foodName}"></td>
					<td th:text="${foodList[iterStat.index].category}"></td>
					<td th:text="${foodList[iterStat.index].meal}"></td>
					<td th:text="${temp.orderPrice}"></td>
					<td th:text="${temp.quantity}"></td>
					<td th:text="${temp.totalAmount}"></td>
					<td><a th:href="@{/user/payment/pay(id=${temp.orderId})}"><button type="button" class="button">Pay</button></a></td>
	</tr>
	
	<tr>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td><label for="Total">Total Amount</label></td>
	<td><input type="number" class="total" th:value="${Total}" readonly></td>
	<td><a th:href="@{/user/payment/payAll(total=${Total})}"><button type="button" class="button">PayAll</button></a></td>
	</tr>

</table>
</div>
    </div>
