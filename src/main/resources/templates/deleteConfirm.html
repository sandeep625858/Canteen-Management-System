    <div>
		<body>
	<h3 class="text-center menuheader">Delete Food Item</h3>
	<table class="menutable">
		<tr class="menutablehead">
			<th>Food ID</th>
			<th>Food Name</th>
			<th>Food Type</th>
			<th>Meal</th>
			<th>Availability</th>
			<th>Food Price</th>
			<th>Month</th>
		</tr>
		<tr class="menutablebody">
			<td th:text="${food.foodId}"></td>
			<td th:text="${food.foodName}"></td>
			<td th:text="${food.category}"></td>
			<td th:text="${food.meal}"></td>
			<td th:text="${food.foodStatus}"></td>
			<td th:text="${food.foodPrice}"></td>
			<td th:text="${food.Month}"></td>
		</tr>
	</table>
	<div class="second">
	<h4 class="text-center">Are You Sure You want to delete the food item ?</h4>
	<a th:href="@{/admin/confirmdelete/{fId}(fId=${food.foodId})}" th:method="post"><div class="additem"><button class="additembutton">Delete</button></div></a>
	</div>
		</body>
