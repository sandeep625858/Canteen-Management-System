        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>NRIFT - Active User</title>
    
</head>
<body>

 <!---------------------------------------------TOP NAVBAR-------------------------------------------------->
    <div>
        <nav class="topnav navbar navbar-expand-sm">
            <!-- Image and text -->
            <nav class="navbar navbar-light bg-light">
                <a class="navbar-brand" href="/admin/
                ">
                     <img th:src="@{/images/logo.png}" width="90" height="30" class="d-inline-block align-top" alt=""
                        loading="lazy">
                    NriFintech Canteen
                </a>
            </nav>

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a href="#"><i id="icon" onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    
    
    
    <!------------------------------------------------MAIN-------------------------------------------------->
    
	<div class="mainbody">
	<div class="container">
	<hr>
	<br/>
		
		<h2>User Details</h2>
		<br/>
		<br/>
				<form th:action="@{/admin/activateUser}" th:object="${user}" method="POST">
				
				<input type="hidden" th:field="*{userId}" />
			
				<input type="text" th:field="*{name}" class="form-control mb-4 col-4" readonly>

				<input type="text" th:field="*{userEmail}" class="form-control mb-4 col-4" readonly>

				<input type="text" th:field="*{preference}" class="form-control mb-4 col-4" readonly>
				
				<input type="hidden" th:field="*{username}" class="form-control mb-4 col-4" readonly>
				
				<input type="hidden" th:field="*{password}" class="form-control mb-4 col-4" readonly>
				
				<input type="hidden" th:field="*{userStatus}" class="form-control mb-4 col-4" readonly>

				<input type="hidden" th:field="*{role}" class="form-control mb-4 col-4" readonly>
				
				<input type="hidden" th:field="*{walletBalance}" class="form-control mb-4 col-4" readonly>

				<button type="submit" class="btn btn-info col-2">Activate User</button>

			<!-- 	<button type="submit" class="btn btn-info col-2"  th:formaction="@{/admin/removeUser}" th:object="${user}" method="POST">Remove User</button>
 -->
			</form>

		<hr>
		<a th:href = "@{/admin/viewAllUser}" class="linkStyle"> Back to User List</a>
	</div>
	</div>
