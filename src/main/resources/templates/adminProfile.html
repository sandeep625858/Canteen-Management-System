    <!-- Bootstrap CSS -->

        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
        integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEysh0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Update Profile</title>
    <link rel="stylesheet" href="/css/template.css">
<link rel="stylesheet" href="/css/user.css" type="text/css">
</head>

<body>
    <!---------------------------------------------TOP NAVBAR-------------------------------------------------->
    <div>
        <nav class="topnav navbar navbar-expand-sm">
            <!-- Image and text -->
            <nav class="navbar navbar-light bg-light">
                <a class="navbar-brand" href="/admin/
                ">
                    <img src="/images/logo.png" width="90" height="30" class="d-inline-block align-top" alt=""
                        loading="lazy">
                    NRI Fintech
                </a>
            </nav>

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a href="#"><i id="icon" onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <!------------------------------------------------MAIN-------------------------------------------------->
    <div class="mainbody">
		<div class="form">
		<form id="form" action="/admin/details/updateAdmin" method="POST">
			<table>
				<tr>
					<td><label for="userId">UserId: </label></td>
					<td><input type="text" name="userId"
						th:value="${adminDetails.userId}" readonly></td>
				</tr>
				<tr>
					<td><label for="name">Name: </label></td>
					<td><input type="text" name="name"
						th:value="${adminDetails.name}"></td>
				</tr>
				<tr>
					<td><label for="userEmail">Email Id: </label></td>
					<td><input type="email" name="userEmail" readonly
						th:value="${adminDetails.userEmail}"></td>
				</tr>
				<tr>
					<td><label for="username">Username: </label></td>
					<td><input type="text" name="username"
						th:value="${adminDetails.username}"></td>
				</tr>
				<tr>
					<td><label for="password">Password: </label></td>
					<td><input type="password" name="password"
						th:value="${adminDetails.password}" readonly></td>
				</tr>
				<tr>
					<span th:if="${adminDetails.preference == 'Nonveg'}">
						<td><label for="preference">Preference: </label></td>
						<td><select name="preference" id="preference">
								<option value="Nonveg">Non-Veg</option>
								<option value="Veg">Veg</option>
						</select></td>
					</span>
					<span th:if="${adminDetails.preference == 'Veg'}">
						<td><label for="preference">Preference: </label></td>
						<td><select name="preference" id="preference">
								<option value="Veg">Veg</option>
								<option value="Nonveg">Non-Veg</option>
						</select></td>
					</span>
				</tr>
				<tr>
					<td></td>
					<td><input type="hidden" name="userStatus"
						th:value="${adminDetails.userStatus}"></td>
				</tr>
				<tr>
					<td></td>
					<td><input type="hidden" name="role"
						th:value="${adminDetails.role}"></td>
				</tr>
				<tr>
					<td></td>
					<td><input type="hidden" name="walletBalance"
						th:value="${adminDetails.walletBalance}"></td>
				</tr>
				<tr>
					<td></td>
					<td><input type="button" class="submit" value="Submit"
						onclick="submitAction()"></td>
				</tr>
			</table>
		</form>
	</div>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"></script>
		<script src="/js/topnav.js"></script>
	<script>
		function submitAction() {
			swal("Message From Canteen Management System",
					"Your Profile submitted succssfully").then(function() {
				document.getElementById("form").submit();
				return false;
			});
		}
	</script>
    </div>
