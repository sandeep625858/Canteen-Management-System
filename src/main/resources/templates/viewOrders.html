	<div class="mainbody">
		<div class="container">
			<br />
			<h1 class="text-center">ORDER DETAILS</h1>
			<br /> <br />
			
			<td><label for="category">Status: </label> : </label>
			<select id="status">
				<option value="all">All</option>
				<option value="Delivered">Delivered</option>
				<option value="Placed">Placed</option>
				<option value="Cancelled">Cancelled</option>
			</select>
			</td>
			&nbsp;
			<td>
			<label for="date">Date : </label>
			<input type="date" id="date" >
			</td>
			<br><br>
			<div align="center">
				<table id="orderTable" border="1" class="table table-bordered table-condensed table-striped">
					<thead>
						<tr>
							<th>OrderId</th>
							<th>User Name</th>
							<th>Food Name</th>
							<th>Food Category</th>
							<th>Meal</th>
							<th>Date of Delivery</th>
							<th>Quantity</th>
							<th>Price</th>
							<th>Total Amount</th>
							<th>Order Status</th>
							<th>Paid Status</th>
							<th>Deliver</th>
						</tr>
					</thead>
					<tbody class="tablebody">
						<tr th:each="order,iterStat:${orders}">
							<td th:text="${order.orderId}"></td>
							<td th:text="${user[iterStat.index].username}"></td>
							<td th:text="${food[iterStat.index].foodName}"></td>
							<td th:text="${food[iterStat.index].category}"></td>
							<td th:text="${food[iterStat.index].meal}"></td>
							<td th:text="${order.savetime}"></td>
							<td th:text="${order.quantity}"></td>
							<td th:text="${order.orderPrice}"></td>
							<td th:text="${order.totalAmount}"></td>
							<td class="status" th:text="${order.orderStatus}"></td>
							<td th:text="${order.paymentStatus}"></td>
							<td>
								<button type="submit" class="btn btn-info deliverbutton"
									name="deliverbutton">
									<a class="deliverbtn" th:href="@{/admin/delivery/{Id}(Id=${order.orderId})}">Deliver</a>
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!--------------------------------- Optional JavaScript; choose one of the two! ----------------->

			<!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->

<script>
    		var tbl = document.getElementById("orderTable");

    		const selection = document.getElementById("status");

    		var tr = tbl.getElementsByTagName("tr");
    		
    		var date = document.getElementById("date");

    		var data;
    		
    		date.addEventListener("change",event=>{
    			
    			for (let i = 1; i < tr.length; i++) {
    				//console.log(tr[i]);
    				data = tr[i].getElementsByTagName("td")[5];
    				console.log(data.innerText);
    				console.log(date.value);
    				if (data.innerText === date.value.toString()) {
    					tr[i].style.display = "";
    				}
    				else {
    					tr[i].style.display = "none";
    				}
    			}
    			
    		})


    		selection.addEventListener('change', event => {
    		if (selection.value === "all") {
    			for (let i = 0; i < tr.length - 1; i++) {
    				tr[i].style.display = "";
    			}
    		}
    		else {
    			for (let i = 1; i < tr.length; i++) {
    				//console.log(tr[i]);
    				data = tr[i].getElementsByTagName("td")[9];
    				console.log(data.innerText);
    				console.log(selection.value);
    				if (data.innerText === selection.value) {
    					tr[i].style.display = "";
    				}
    				else {
    					tr[i].style.display = "none";
    				}
    			}
    		}
    })
    </script>


			<script>
				var checkstatus = document.getElementsByClassName('status');
				console.log(checkstatus[0].innerText);
				var button = document.getElementsByClassName('deliverbutton');
				for (let i = 0; i < checkstatus.length; i++) {
					if (checkstatus[i].innerText === "Delivered" || checkstatus[i].innerText === "Cancelled") {
						button[i].removeAttribute('href');
						button[i].style.background = "grey";
						button[i].style.border="grey";
						button[i].style.cursor = "none";
					}
				}
			</script>
