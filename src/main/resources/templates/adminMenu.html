<!doctype html>
<html lang="en">

<head>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!-- Bootstrap CSS -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
	integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
	crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
        integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEysh0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>NRIFT - Menu</title>
    <link rel="stylesheet" th:href="@{/css/template.css}">
</head>

<body>
	<!---------------------------------------------TOP NAVBAR-------------------------------------------------->
	<div>
		<nav class="topnav navbar navbar-expand-sm">
			<!-- Image and text -->
			<nav class="navbar navbar-light bg-light">
				<a class="navbar-brand" href="/admin/"> <img
					th:src="@{/images/logo.png}" width="90" height="30"
					class="d-inline-block align-top" alt="" loading="lazy"> NRI
					Fintech
				</a>
			</nav>

			<ul class="navbar-nav ml-auto">

				<li class="nav-item"><a href="#"><i id="icon"
						onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
				</li>
				<li class="nav-item"><a class="nav-link" href="/logout">
						Logout </a></li>
			</ul>
		</nav>
	</div>
	<!------------------------------------------------MAIN-------------------------------------------------->
	<div class="mainbody">

		<div class="container">
			<h1 class="menuhead text-center">MENU DETAILS</h1>
			<div class="row">
				<!--  <div class="col">-->
				<!--  <h3 class="p-3">Admin Menu To be displayed with tables</h3>-->
			</div>
			<div class="">
				<div class="check">
					<!--  <a href="/admin/addItemForm"
						style="text-align: right; text-decoration: none;"><i
						class="fas fa-plus fa-2x"></i><span style="font-size: 25px;">&nbsp;ADD</span>
						</a>
					-->
				</div>
			</div>
		</div>

		<div class="filter">
			<table class="table menutable" id="table">
				<thead>
					<div class="plus">
						<a class="add" href="/admin/addItemForm"><i
							class="fas fa-plus fa-2x"></i><span style="font-size: 25px;">&nbsp;ADD</span>
						</a>
					</div>
					<div>
					<tr class="menuheads1">
						<td><label for="category">Food Category : </label> <select
							name="category" id="category">
								<option value="default">All</option>
								<option value="Nonveg">Non-Veg</option>
								<option value="Veg">Veg</option>
							</select>
						</td>
						<td>
							<label for="meal">Meal : </label>
							<select name="meal" id="meal">
								<option value="default">All</option>
								<option value="Breakfast">Breakfast</option>
								<option value="Lunch">Lunch</option>
							</select>
						</td>
						<td></td>
						<td></td>
						<td><input type="text" placeholder="Search.." id="searchBar"
							onkeyup="filterFunc2()"></td>
						<td></td>
						<td></td>
						<td></td>
						<td></td>
					</tr>
					<tr class="menuheads">
						<th>Food ID</th>
						<th>Food Name</th>
						<th>Food Type</th>
						<th>Meal</th>
						<th>Availability</th>
						<th>Food Price</th>
						<th>Month</th>
						<th>Update</th>
						<th>Delete</th>
					</tr>
				</thead>
				<tbody class="menubody">
					<tr th:each="food: ${foodList}">
						<td th:text="${food.foodId}"></td>
						<!-- <td th:text="${food.foodId}"></td> -->
						<td th:text="${food.foodName}"></td>
						<td th:text="${food.category}"></td>
						<td th:text="${food.meal}"></td>
						<td th:text="${food.foodStatus}"></td>
						<td th:text="${food.foodPrice}"></td>
						<td th:text="${food.Month}"></td>
						<td><a th:href="@{/admin/update/{fId}(fId=${food.foodId})}"><i
								class="fas fa-marker fa-lg"></i></a></td>
						<td><a th:href="@{/admin/delete/{fId}(fId=${food.foodId})}"><i
								class="fas fa-minus-circle fa-lg"></a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- --------------------------------------------FOOTER-------------------------------------------------------->
	<div class="footer">
		<p>Copyright &copy; 2023 NRI Fintech. All rights reserved.</p>
	</div>



	<!--------------------------------- Optional JavaScript; choose one of the two! ----------------->

	<!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
		integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
		crossorigin="anonymous"></script>

	<!-- Option 2: jQuery, Popper.js, and Bootstrap JS
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    -->
	<script src="../js/topnav.js"></script>
	<script src="../js/search.js"></script>
	<script src="../js/filter.js"></script>
</body>

</html>
