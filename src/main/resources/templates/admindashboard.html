<!doctype html>
<html lang="en">

<head>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!-- Bootstrap CSS -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
	integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
	integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEysh0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<title>NRIFT - Admin DashBoard</title>
<link rel="stylesheet" href="../css/template.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/reset.css">
</head>

<body>
    <!---------------------------------------------TOP NAVBAR-------------------------------------------------->
    <div>
        <nav class="topnav navbar navbar-expand-sm">
            <!-- Image and text -->
            <nav class="navbar navbar-light bg-light">
                <a class="navbar-brand" href="/admin/">
                    <img src="/images/logo.png" width="90" height="30" class="d-inline-block align-top" alt=""
                        loading="lazy">
                    NRI Fintech
                </a>
            </nav>

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a href="#"><i id="icon" onclick="openFullscreen();" class="fas fa-expand-arrows-alt fa-2x"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <!---------------------------------------------SIDE NAVBAR-------------------------------------------------->
    <div class="adminleft col-2.5">
        <div class="row">
            <div class="col-3">
                <div class="sidenav nav flex-column nav-pills" id="v-pills-tab" role="tablist"
                    aria-orientation="vertical">
                    <!--User Icon-->
                    <a class="usericon menu nav-link active" id="v-pills-home-tab" data-toggle="pill"
                        href="#v-pills-home" role="tab" aria-controls="v-pills-home" aria-selected="true">
                        
                        <i class="fas fa-user fa-4x">
                            </i><br><br><span class="admin">Admin</span></a>
                    <a class="menu nav-link" id="v-pills-home-tab" data-toggle="pill" href="#v-pills-home" role="tab"
                        aria-controls="v-pills-home" aria-selected="false">
                        
                        <i class="adminicon fa fa-table fa-1.5x"
                        aria-hidden="true"></i>Admin Name:  <span th:text="${adminName}"> </a>
                    
                    <a class="menu nav-link" id="v-pills-resetpwd-tab" href="/admin/resetPasswordForm"
                        role="tab" aria-controls="v-pills-resetpwd" aria-selected="false">
                        
                        <i class="adminicon fa fa-table fa-1.5x"
                        aria-hidden="true"></i>Reset password</a>
                   
                    <a class="menu nav-link" id="update-tab"  href="/admin/details" role="tab"
                        aria-controls="update" aria-selected="false">
                        
                        <i class="adminicon fa fa-table fa-1.5x"
                        aria-hidden="true"></i>Update</a>
                </div>
            </div>
            <div class="maincontent col-9">
                <div class="dashboard tab-content" id="v-pills-tabContent">
                    <!--------------------------USER-------------------->
                    <div class="tab-pane fade show active" id="v-pills-home" role="tabpanel"
                        aria-labelledby="v-pills-home-tab">
                        <div class="row">
                            <div class="col-sm-2.4">
                                <a href="/admin/menu">
                                    <div class="usercard card">
                                        <div class="card-body text-center">
                                            <h2 class="card-title"><i class="settings fa fa-utensils fa-2x"
                                                    aria-hidden="true"></i></h2>
                                            <h5 class="card-title">MENU DETAILS</h5>

                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-sm-2.4">
                                <a href="/admin/DeliverOrder">
                                    <div class="usercard card">
                                        <div class="card-body text-center">
                                            <h2 class="card-title"><i class="settings fa fa-utensils fa-2x"
                                                    aria-hidden="true"></i></h2>
                                            <h5 class="card-title">ORDER DETAILS</h5>

                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-sm-2.4">
                                <a href="/admin/viewAllUser">
                                    <div class="usercard card">
                                        <div class="card-body text-center">
                                            <h2 class="card-title"><i class="settings fa fa-user fa-2x"
                                                    aria-hidden="true"></i></h2>
                                            <h5 class="card-title">USER DETAILS</h5>

                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-sm-2.4">
                                <a href="/admin/exportOptions">
                                    <div class="usercard card">
                                        <div class="card-body text-center">
                                            <h2 class="card-title"><i class="settings fa fa-chart-line fa-2x"
                                                    aria-hidden="true"></i></h2>
                                            <h5 class="card-title">CREATE REPORT</h5>

                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-sm-2.4">
                                <a href="/admin/feedback">
                                    <div class="usercard card">
                                        <div class="card-body text-center">
                                            <h2 class="card-title"><i class="settings fa fa-comment fa-2x"
                                                    aria-hidden="true"></i></h2>
                                            <h5 class="card-title">VIEW FEEDBACK</h5>

                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-----------------RESET PASSWORD-------------------->
                    <div class="tab-pane fade" id="v-pills-resetpwd" role="tabpanel"
                        aria-labelledby="v-pills-resetpwd-tab">

                        <div class="resetcard card">
                            <div class="resetpwd card-header h5 text-white  text-center">Reset Password </div>
                            <div class="card-body px-5" style="padding: 5%">

                                <div class="form-outline">
                                    <label class="form-label" for="oldPassword">Old password: </label>
                                    <input type="password" id="oldPassword" class="form-control my-3" />
                                </div>
                                <div class="form-outline">
                                    <label class="form-label" for="newPassword">New password:</label>
                                    <input type="password" id="newPassword" class="form-control my-3" />
                                </div>
                                <div class="form-outline">
                                    <label class="form-label" for="confirmPassword">Confirm password:</label>
                                    <input type="password" id="confirmPassword" class="form-control my-3" />
                                </div>
                                <a href="#" class="resetpwd text-white btn w-100">Submit</a>
                            </div>
                        </div>

                    </div>
                    <!----------------UPDATE----------------------------->
                    <!--<div class="tab-pane fade" id="update" role="tabpanel" aria-labelledby="update-tab">Content3</div>-->
                </div>
            </div>
        </div>
    </div>
    <!-- --------------------------------------------FOOTER-------------------------------------------------------->
    <div class="dashboardfooter">
        <p>Copyright &copy; 2023 NRI Fintech. All rights reserved.</p>
    </div>



    <!--------------------------------- Optional JavaScript; choose one of the two! ----------------->

    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
        crossorigin="anonymous"></script>

    <!-- Option 2: jQuery, Popper.js, and Bootstrap JS
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    -->
	<script src="../js/topnav.js"></script>
	<script src="../js/resetpassword.js"></script>
</body>

</html>
