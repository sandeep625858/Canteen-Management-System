              <div class="resetcard card">
							<form name="reset" method="post" action="/resetadmin">
								<div class="resetpwd card-header h5 text-white  text-center">Reset
									Password</div>
								<div class="card-body px-5" style="padding: 5%">

									<div class="form-outline">
										<label class="form-label" for="oldPassword">Old
											password: </label> <input type="password" name= "oldpassword" id="oldPassword"
											class="form-control my-3" required/>
											<span id="passwordMsg" th:text="${msg}"></span>
									</div>
									<div class="form-outline">
										<label class="form-label" for="newPassword">New
											password:</label> <input type="password" name="password" id="newPassword"
											class="form-control my-3" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*_=+-]).{8,16}$" required>
										<h7><Strong>Note: </Strong>(8-16 Chars)(A-Z,a-z,0-9,special characters like @,# etc)</h7>
									</div>
									<div class="form-outline">
										<label class="form-label" for="confirmPassword">Confirm
											password:</label> <input type="password" onkeyup="checkpass()"  name="confirmPassword" id="confirmPassword"
											class="form-control my-3" /> 
									</div>
									<div class="submitbtn"> <button type="button" id="button" onclick="matchPassword()">Submit</button></div>
									
								</div>
							</form>
						</div>
        
    </div>
